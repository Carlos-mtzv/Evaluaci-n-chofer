<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Examen de Habilidades Matemáticas — Chofer</title>
<style>
  :root{
    --navy:#2A255B;
    --navy-ink:#201C43;
    --red:#E30613;
    --yellow:#FEE300;
    --cream:#F6F4EE;
    --white:#FFFFFF;
    --hairline:#DEDAE8;
    --green:#1E8E3E;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
    background:var(--cream);
    color:var(--navy-ink);
    line-height:1.5;
    padding:0 0 60px 0;
  }
  header{
    background:var(--navy);
    padding:32px 24px 26px;
    text-align:center;
  }
  header .eyebrow{
    color:var(--yellow);
    font-weight:700;
    letter-spacing:2px;
    text-transform:uppercase;
    font-size:13px;
    margin-bottom:8px;
  }
  header h1{
    color:#fff;
    font-size:26px;
    font-weight:800;
  }
  header p{
    color:#D8D5EA;
    font-size:14px;
    margin-top:8px;
    max-width:520px;
    margin-left:auto;
    margin-right:auto;
  }
  .wrap{
    max-width:640px;
    margin:0 auto;
    padding:24px 20px;
  }
  .card{
    background:var(--white);
    border-radius:10px;
    padding:20px 22px;
    margin-bottom:16px;
    border:1px solid var(--hairline);
  }
  .id-card label{
    display:block;
    font-size:13px;
    font-weight:700;
    color:var(--red);
    text-transform:uppercase;
    letter-spacing:1px;
    margin-bottom:6px;
  }
  .id-card input{
    width:100%;
    padding:10px 12px;
    border:1.5px solid var(--hairline);
    border-radius:6px;
    font-size:15px;
    margin-bottom:14px;
    font-family:inherit;
  }
  .id-card input:focus{outline:2px solid var(--navy);border-color:var(--navy);}

  .q-topic{
    font-size:12px;
    font-weight:700;
    color:var(--navy);
    background:#EDEBF7;
    display:inline-block;
    padding:3px 10px;
    border-radius:999px;
    text-transform:uppercase;
    letter-spacing:0.5px;
    margin-bottom:10px;
  }
  .q-text{
    font-size:16px;
    font-weight:600;
    margin-bottom:14px;
    color:var(--navy-ink);
  }
  .q-num{color:var(--red);margin-right:4px;}
  .options{list-style:none;}
  .options li{margin-bottom:8px;}
  .options label{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 12px;
    border:1.5px solid var(--hairline);
    border-radius:8px;
    cursor:pointer;
    font-size:15px;
    transition:border-color .15s, background .15s;
  }
  .options label:hover{border-color:var(--navy);}
  .options input{accent-color:var(--navy);width:16px;height:16px;flex-shrink:0;}
  .options input:checked + span{font-weight:700;}
  .options li.selected label{border-color:var(--navy);background:#F1EEF9;}

  button#submitBtn{
    display:block;
    width:100%;
    background:var(--red);
    color:#fff;
    border:none;
    padding:16px;
    font-size:16px;
    font-weight:700;
    border-radius:8px;
    cursor:pointer;
    text-transform:uppercase;
    letter-spacing:0.5px;
    margin-top:8px;
  }
  button#submitBtn:hover{background:#C10510;}
  button#submitBtn:disabled{background:#B9B6C9;cursor:not-allowed;}

  .warn{
    font-size:13px;
    color:var(--red);
    text-align:center;
    margin-top:10px;
    min-height:18px;
  }

  /* Results screen */
  #results{display:none;}
  .score-hero{
    background:var(--navy);
    color:#fff;
    text-align:center;
    padding:30px 20px;
    border-radius:10px;
    margin-bottom:16px;
  }
  .score-hero .big{
    font-size:52px;
    font-weight:800;
    color:var(--yellow);
    line-height:1;
  }
  .score-hero .label{
    font-size:14px;
    color:#D8D5EA;
    margin-top:6px;
    text-transform:uppercase;
    letter-spacing:1px;
  }
  .badge{
    display:inline-block;
    margin-top:14px;
    padding:6px 16px;
    border-radius:999px;
    font-weight:700;
    font-size:14px;
  }
  .badge.pass{background:var(--green);color:#fff;}
  .badge.fail{background:var(--red);color:#fff;}

  .breakdown-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 0;
    border-bottom:1px solid var(--hairline);
    font-size:14px;
  }
  .breakdown-item:last-child{border-bottom:none;}
  .breakdown-item .ok{color:var(--green);font-weight:700;}
  .breakdown-item .bad{color:var(--red);font-weight:700;}

  .review-q{
    padding:14px 0;
    border-bottom:1px solid var(--hairline);
  }
  .review-q:last-child{border-bottom:none;}
  .review-q .rq-text{font-weight:600;margin-bottom:6px;font-size:14.5px;}
  .review-q .rq-answer{font-size:13.5px;color:#4B4870;}
  .review-q .rq-answer.correct{color:var(--green);}
  .review-q .rq-answer.incorrect{color:var(--red);}

  #copyBtn{
    display:block;
    width:100%;
    background:var(--navy);
    color:#fff;
    border:none;
    padding:14px;
    font-size:15px;
    font-weight:700;
    border-radius:8px;
    cursor:pointer;
    margin-top:6px;
  }
  #copyBtn:hover{background:var(--navy-ink);}
  #copyMsg{
    text-align:center;
    font-size:13px;
    color:var(--green);
    margin-top:8px;
    min-height:16px;
    font-weight:600;
  }
</style>
</head>
<body>

<header>
  <div class="eyebrow">Tubos y Conexiones</div>
  <h1>Examen de Habilidades Matemáticas</h1>
  <p>Evaluación para candidatos a Chofer. Lee cada caso con cuidado antes de responder. Puedes usar calculadora.</p>
</header>

<div class="wrap">

  <div id="examSection">
    <div class="card id-card">
      <label for="nombre">Nombre completo del candidato</label>
      <input type="text" id="nombre" placeholder="Ej. Juan Pérez López" required>
    </div>

    <div id="questionsContainer"></div>

    <button id="submitBtn">Calificar examen</button>
    <div class="warn" id="warnMsg"></div>
  </div>

  <div id="results">
    <div class="score-hero">
      <div class="big" id="scorePct">0%</div>
      <div class="label" id="scoreFraction">0 de 0 correctas</div>
      <div class="badge" id="scoreBadge"></div>
    </div>

    <div class="card">
      <div class="q-text" style="margin-bottom:12px;">Desglose por tema</div>
      <div id="breakdown"></div>
    </div>

    <div class="card">
      <div class="q-text" style="margin-bottom:6px;">Revisión de respuestas</div>
      <div id="review"></div>
    </div>

    <button id="copyBtn">Copiar resultados</button>
    <div id="copyMsg"></div>
  </div>

</div>

<script>
const questions = [
  {
    topic: "Suma de importes",
    text: "Un cliente hace un pedido de tubería: 6 tramos a $210 c/u y 15 conexiones a $48 c/u. Además pide que le apliques un cargo de $150 por flete. ¿Cuál es el importe total a cobrar?",
    options: ["$1,980", "$2,010", "$2,130", "$2,250"],
    correct: 2
  },
  {
    topic: "Suma de importes",
    text: "Entregas 4 pedidos en la ruta con importes de $680, $1,150, $95 (cancelado, no se cobra) y $430. ¿Cuánto efectivo debes traer al final?",
    options: ["$2,355", "$2,260", "$2,175", "$2,450"],
    correct: 1
  },
  {
    topic: "Verificación de efectivo",
    text: "La nota de venta es de $2,100. El cliente te entrega 4 billetes de $500 y 2 monedas de $20. ¿El efectivo recibido cubre la nota, sobra o falta?",
    options: ["Cubre exacto", "Sobra $60", "Falta $60", "Falta $340"],
    correct: 2
  },
  {
    topic: "Verificación de efectivo",
    text: "Vas a cobrar dos notas del mismo cliente: $1,180 y $860, pero él te dice que una nota de crédito de $200 ya se aplicó a la segunda. ¿Cuánto efectivo debes cobrar en total?",
    options: ["$2,040", "$1,840", "$2,240", "$1,980"],
    correct: 1
  },
  {
    topic: "Cálculo de cambio",
    text: "El total de la compra es $1,675. El cliente paga con 2 billetes de $1,000. Además te pide que le descuentes $25 que le debes de una entrega anterior. ¿Cuánto cambio le entregas?",
    options: ["$300", "$325", "$350", "$275"],
    correct: 2
  },
  {
    topic: "Cálculo de cambio",
    text: "Un cliente paga $3,000 por una compra de $2,860, pero te pide $40 de cambio en monedas de $10. ¿Cuántas monedas de $10 le das y cuánto entregas en billetes?",
    options: ["4 monedas ($40) y $100 en billetes", "4 monedas ($40) y $60 en billetes", "14 monedas y $0 en billetes", "4 monedas ($40) y $140 en billetes"],
    correct: 0
  },
  {
    topic: "Pagos parciales",
    text: "Un cliente debe $6,500. Abona $2,000 hoy y se compromete a pagar el 40% del saldo restante la próxima semana. ¿Cuánto pagará la próxima semana?",
    options: ["$2,600", "$1,800", "$1,600", "$2,000"],
    correct: 1
  },
  {
    topic: "Pagos parciales",
    text: "Un cliente tiene un saldo de $4,800 dividido en 3 pagos iguales. Ya realizó el primer pago. ¿Cuánto le queda pendiente en total?",
    options: ["$1,600", "$3,200", "$2,400", "$3,600"],
    correct: 1
  },
  {
    topic: "Precio por cantidad",
    text: "Se venden 18 codos a $35 cada uno, pero por compra mayor a 15 piezas aplica un descuento de $3 por pieza. ¿Cuál es el importe final?",
    options: ["$630", "$576", "$594", "$558"],
    correct: 1
  },
  {
    topic: "Precio por cantidad",
    text: "Un cliente pide 7 válvulas a $180 cada una y 3 metros de manguera a $65 el metro. Si paga con $1,600, ¿cuánto cambio recibe?",
    options: ["$135", "$145", "$155", "$165"],
    correct: 1
  },
  {
    topic: "Devoluciones y bonificaciones",
    text: "Una nota es de $3,200. El cliente devuelve mercancía por $450 y además tiene una bonificación del 5% sobre el saldo restante. ¿Cuánto debe pagar finalmente?",
    options: ["$2,750", "$2,612.50", "$2,660", "$2,700"],
    correct: 1
  },
  {
    topic: "Devoluciones y bonificaciones",
    text: "Un pedido de $2,400 se cancela parcialmente: el cliente ya no quiere $600 de mercancía. Del resto, se le aplica un descuento por pronto pago del 10%. ¿Cuál es el importe final a cobrar?",
    options: ["$1,620", "$1,800", "$1,710", "$1,980"],
    correct: 0
  }
];

const container = document.getElementById('questionsContainer');
questions.forEach((q, i) => {
  const qDiv = document.createElement('div');
  qDiv.className = 'card';
  qDiv.innerHTML = `
    <div class="q-topic">${q.topic}</div>
    <div class="q-text"><span class="q-num">${i+1}.</span>${q.text}</div>
    <ul class="options" id="opts-${i}">
      ${q.options.map((opt, j) => `
        <li>
          <label>
            <input type="radio" name="q${i}" value="${j}">
            <span>${opt}</span>
          </label>
        </li>
      `).join('')}
    </ul>
  `;
  container.appendChild(qDiv);
});

container.addEventListener('change', (e) => {
  if (e.target.type === 'radio') {
    const qIndex = e.target.name.replace('q','');
    const list = document.getElementById(`opts-${qIndex}`);
    [...list.children].forEach(li => li.classList.remove('selected'));
    e.target.closest('li').classList.add('selected');
  }
});

document.getElementById('submitBtn').addEventListener('click', () => {
  const nombre = document.getElementById('nombre').value.trim();
  const warnMsg = document.getElementById('warnMsg');

  if (!nombre) {
    warnMsg.textContent = 'Por favor ingresa el nombre del candidato.';
    return;
  }

  let answered = 0;
  let correctCount = 0;
  const topicStats = {};
  const reviewData = [];

  questions.forEach((q, i) => {
    const selected = document.querySelector(`input[name="q${i}"]:checked`);
    if (!topicStats[q.topic]) topicStats[q.topic] = {correct:0, total:0};
    topicStats[q.topic].total++;

    if (selected) {
      answered++;
      const val = parseInt(selected.value);
      const isCorrect = val === q.correct;
      if (isCorrect) { correctCount++; topicStats[q.topic].correct++; }
      reviewData.push({q, isCorrect, chosen: q.options[val]});
    } else {
      reviewData.push({q, isCorrect:false, chosen: '(sin responder)'});
    }
  });

  if (answered < questions.length) {
    warnMsg.textContent = `Faltan ${questions.length - answered} pregunta(s) por responder.`;
    return;
  }

  warnMsg.textContent = '';
  const pct = Math.round((correctCount / questions.length) * 100);

  document.getElementById('scorePct').textContent = pct + '%';
  document.getElementById('scoreFraction').textContent = `${correctCount} de ${questions.length} correctas — ${nombre}`;
  const badge = document.getElementById('scoreBadge');
  const passed = pct >= 70;
  badge.textContent = passed ? 'Aprobado' : 'No aprobado';
  badge.className = 'badge ' + (passed ? 'pass' : 'fail');

  const breakdownDiv = document.getElementById('breakdown');
  breakdownDiv.innerHTML = Object.entries(topicStats).map(([topic, stat]) => `
    <div class="breakdown-item">
      <span>${topic}</span>
      <span class="${stat.correct === stat.total ? 'ok' : 'bad'}">${stat.correct}/${stat.total}</span>
    </div>
  `).join('');

  const reviewDiv = document.getElementById('review');
  reviewDiv.innerHTML = reviewData.map((r, i) => `
    <div class="review-q">
      <div class="rq-text">${i+1}. ${r.q.text}</div>
      <div class="rq-answer ${r.isCorrect ? 'correct' : 'incorrect'}">
        Respuesta del candidato: ${r.chosen} ${r.isCorrect ? '✓' : '— Correcta: ' + r.q.options[r.q.correct]}
      </div>
    </div>
  `).join('');

  document.getElementById('examSection').style.display = 'none';
  document.getElementById('results').style.display = 'block';
  window.scrollTo(0,0);

  window._resultsSummary = `Examen de Habilidades Matemáticas — Chofer\nCandidato: ${nombre}\nResultado: ${correctCount}/${questions.length} (${pct}%) — ${passed ? 'Aprobado' : 'No aprobado'}\n\n` +
    Object.entries(topicStats).map(([topic, stat]) => `${topic}: ${stat.correct}/${stat.total}`).join('\n') +
    `\n\nFecha: ${new Date().toLocaleDateString('es-MX')}`;
});

document.getElementById('copyBtn').addEventListener('click', () => {
  const msg = document.getElementById('copyMsg');
  navigator.clipboard.writeText(window._resultsSummary || '').then(() => {
    msg.textContent = 'Resultados copiados. Puedes pegarlos en WhatsApp o correo.';
  }).catch(() => {
    msg.textContent = 'No se pudo copiar automáticamente. Toma captura de pantalla de los resultados.';
  });
});
</script>

</body>
</html>
